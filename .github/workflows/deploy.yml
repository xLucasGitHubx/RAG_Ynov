name: Déploiement Azure

# Déploiement continu : après chaque CI réussie sur main (donc après chaque fusion), l'image est
# construite, poussée dans Azure Container Registry puis déployée sur Azure Container Apps.
# Aussi lançable à la main (Actions > Déploiement Azure > Run workflow).
# Prérequis (une seule fois) : scripts/azure_provision.ps1 puis docs/deploiement_azure.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Image et Container Apps
    # Jamais après une CI en échec, ni pour une CI déclenchée par une pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
      # Commit testé par la CI (workflow_run) ou commit courant (lancement manuel).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Vérifier la configuration
        run: |
          for name in REGISTRY RESOURCE_GROUP APP; do
            if [ -z "${!name}" ]; then
              echo "::error::La variable GitHub AZURE_* correspondant à $name est vide (voir docs/deploiement_azure.md)."
              exit 1
            fi
          done
          test -f chroma_db/chroma.sqlite3 || { echo "::error::Index chroma_db absent du dépôt."; exit 1; }

      # L'image fait environ 8 Go (torch, BGE-M3, Docling) : on libère de la place sur le runner.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connexion au registre
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.AZURE_REGISTRY }}.azurecr.io/rag-api:${{ env.SHA }}
            ${{ vars.AZURE_REGISTRY }}.azurecr.io/rag-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer la nouvelle révision
        run: |
          az containerapp update \
            --name "$APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/rag-api:$SHA" \
            --set-env-vars "GIT_SHA=$SHA" \
            --output none

      # /health renvoie le commit servi : on attend que ce soit le nouveau, pas l'ancien conteneur.
      - name: Vérifier que la nouvelle version répond
        run: |
          fqdn=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 40); do
            body=$(curl -fsS "https://$fqdn/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"commit\":\"$SHA\""; then
              echo "Déployé : https://$fqdn/ui/ (commit $SHA)"; exit 0
            fi
            sleep 15
          done
          echo "::error::Après 10 minutes, /health ne renvoie pas le commit $SHA : l'ancienne version répond encore."
          exit 1
