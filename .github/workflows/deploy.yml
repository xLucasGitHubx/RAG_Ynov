name: Déploiement Azure

# Déclenchement manuel (Actions > Déploiement Azure > Run workflow) : chaque déploiement
# consomme des crédits Azure, il ne part donc pas à chaque push.
# Prérequis (une seule fois) : scripts/azure_provision.ps1 puis docs/deploiement_azure.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Image et Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        run: |
          for name in REGISTRY RESOURCE_GROUP APP; do
            if [ -z "${!name}" ]; then
              echo "::error::La variable GitHub AZURE_* correspondant à $name est vide (voir docs/deploiement_azure.md)."
              exit 1
            fi
          done
          test -f chroma_db/chroma.sqlite3 || { echo "::error::Index chroma_db absent du dépôt."; exit 1; }

      # L'image fait environ 7 Go (torch, BGE-M3) : on libère de la place sur le runner.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connexion au registre
        run: az acr login --name "$REGISTRY"

      - uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.AZURE_REGISTRY }}.azurecr.io/rag-api:${{ github.sha }}
            ${{ vars.AZURE_REGISTRY }}.azurecr.io/rag-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déployer la nouvelle révision
        run: |
          az containerapp update \
            --name "$APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/rag-api:${{ github.sha }}" \
            --output none

      - name: Vérifier que l'API répond
        run: |
          fqdn=$(az containerapp show --name "$APP" --resource-group "$RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$fqdn/health" | tee /dev/stderr | grep -q '"status":"ok"'; then
              echo; echo "Déployé : https://$fqdn/ui/"; exit 0
            fi
            sleep 10
          done
          echo "::error::L'API ne répond pas après 5 minutes."
          exit 1
