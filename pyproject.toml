[project]
name = "rag-ynov"
version = "0.1.0"
description = "Assistant documentaire RH/IT (RAG) — projet fil rouge Ynov"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
