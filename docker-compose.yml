services:
  api:
    build: .
    image: rag-api:local
    container_name: rag-api
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    environment:
      # Dans le réseau compose, Ollama est joignable par son nom de service.
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # LLM local quantifié pour le développement (aucune minute ZeroGPU consommée).
  # Premier lancement : docker compose exec ollama ollama pull ministral-3:3b
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - rag-ollama:/root/.ollama
    # GPU NVIDIA si disponible (Docker Desktop + WSL2) ; retirer ce bloc sur une machine sans GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Itération 8 : MLflow s'ajoutera ici comme service.

volumes:
  rag-ollama:
    # Nom fixe : réutilise le volume créé par `docker run ... -v rag-ollama:/root/.ollama`.
    name: rag-ollama
